server:
  port: 8080

spring:
  application:
    name: cloth-store

  # ===================== H2 In-Memory Database =====================
  # To switch to PostgreSQL later:
  # 1. Uncomment the PostgreSQL dependency in pom.xml
  # 2. Replace the datasource section below with the PostgreSQL block
  # 3. Change ddl-auto if needed
  #  datasource:
  #    url: jdbc:h2:mem:clothstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  #    driver-class-name: org.h2.Driver
  #    username: sa
  #    password:

  # ---- PostgreSQL (uncomment when ready) ----
  datasource:
    url: jdbc:postgresql://ep-broad-bonus-aztylger-pooler.c-3.ap-southeast-1.aws.neon.tech/leowear?sslmode=require&channel_binding=require
    driver-class-name: org.postgresql.Driver
    username: leowear
    password: npg_v7KaqnRGf1Eo

  #  h2:
  #    console:
  #      enabled: true
  #      path: /h2-console
  #      settings:
  #        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        #org.hibernate.dialect.H2Dialect For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ===================== Email SMTP =====================
  # Gmail: host smtp.gmail.com, port 587, use App Password (not account password)
  # Brevo: host smtp-relay.brevo.com, port 587
  # Resend: host smtp.resend.com, port 587, username = resend, password = API key
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:targetnests@gmail.com}
    password: ${MAIL_PASSWORD:fpsjjrpaejvfplya}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# JWT Configuration
jwt:
  secret: ClothStoreSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024SecureKey!!
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

# CORS
cors:
  allowed-origins: https://leowear-frontend.pages.dev/

# Public origin used by /api/sitemap.xml URLs. Update to real domain in prod.
sitemap:
  public-base-url: https://leowear.in

logging:
  level:
    com.clothstore: INFO
    org.springframework.security: WARN

# ===================== Razorpay Payment Gateway =====================
